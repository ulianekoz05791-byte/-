<script type="text/babel" data-presets="react">
const { useState, useEffect, useCallback, useRef } = React;
const db = window.__db;

// Все данные приложения живут в коллекции "packingApp":
//   packingApp/catalog  -> { groups: [...] }
//   packingApp/history  -> { entries: [...] }
const catalogRef = db.collection("packingApp").doc("catalog");
const historyRef = db.collection("packingApp").doc("history");

const DEFAULT_GROUPS = [
  "blackBurn", "sebero", "masthave", "darkside", "догма", "satyr",
  "bonche", "trofimofff's", "tangiers", "deus", "сарма", "jent",
  "spectrum", "overdose", "starline", "afzal",
];

function makeId() {
  return Math.random().toString(36).slice(2) + Date.now().toString(36);
}

function defaultCatalog() {
  return {
    groups: DEFAULT_GROUPS.map((name) => ({ id: makeId(), name, flavors: [] })),
  };
}

function formatDate(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString("ru-RU", { day: "2-digit", month: "2-digit", year: "numeric" }) +
    " " + d.toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" });
}

function buildArrivalText(groupsWithWeights) {
  const lines = [];
  let total = 0;
  groupsWithWeights.forEach((g) => {
    lines.push(g.name);
    g.items.forEach((it) => {
      const w = parseFloat(it.weight) || 0;
      total += w;
      const wStr = Number.isInteger(w) ? String(w) : String(w).replace(".", ",");
      lines.push(`${it.flavor} - ${wStr} г`);
    });
    lines.push("");
  });
  const totalStr = Number.isInteger(total) ? String(total) : String(total).replace(".", ",");
  lines.push(`Всего: ${totalStr} г`);
  return { text: lines.join("\n"), total };
}

function TobaccoPackingApp() {
  const [status, setStatus] = useState("loading"); // loading | ready | error
  const [catalog, setCatalog] = useState(null);
  const [history, setHistory] = useState([]);
  const [view, setView] = useState("catalog"); // catalog | select | weights | result | history
  const [expanded, setExpanded] = useState({});
  const [showAddGroup, setShowAddGroup] = useState(false);
  const [newGroupName, setNewGroupName] = useState("");
  const [flavorInputs, setFlavorInputs] = useState({});
  const [selected, setSelected] = useState({}); // { groupId: Set(flavor) }
  const [weights, setWeights] = useState({}); // { groupId: { flavor: string } }
  const [resultData, setResultData] = useState(null); // { text, total }
  const [copyLabel, setCopyLabel] = useState("Скопировать");
  const [openHistoryId, setOpenHistoryId] = useState(null);
  const didInit = useRef(false);

  const persistCatalog = useCallback(async (next) => {
    setCatalog(next);
    try {
      await catalogRef.set(next);
    } catch (e) {
      console.error("Failed to save catalog", e);
    }
  }, []);

  const persistHistory = useCallback(async (next) => {
    setHistory(next);
    try {
      await historyRef.set({ entries: next });
    } catch (e) {
      console.error("Failed to save history", e);
    }
  }, []);

  useEffect(() => {
    if (didInit.current) return;
    didInit.current = true;

    let unsubCatalog = () => {};
    let unsubHistory = () => {};

    (async () => {
      try {
        const catSnap = await catalogRef.get();
        let cat = catSnap.exists ? catSnap.data() : null;
        if (!cat || !Array.isArray(cat.groups)) {
          cat = defaultCatalog();
          await catalogRef.set(cat);
        }
        setCatalog(cat);

        const histSnap = await historyRef.get();
        const hist = (histSnap.exists && Array.isArray(histSnap.data().entries))
          ? histSnap.data().entries
          : [];
        setHistory(hist);

        setStatus("ready");

        // Живая синхронизация между устройствами: если кто-то другой
        // изменил каталог/историю, обновляем экран автоматически.
        unsubCatalog = catalogRef.onSnapshot((snap) => {
          if (snap.exists) {
            const data = snap.data();
            if (data && Array.isArray(data.groups)) setCatalog(data);
          }
        });
        unsubHistory = historyRef.onSnapshot((snap) => {
          if (snap.exists) {
            const data = snap.data();
            if (data && Array.isArray(data.entries)) setHistory(data.entries);
          }
        });
      } catch (e) {
        console.error(e);
        setStatus("error");
      }
    })();

    return () => {
      unsubCatalog();
      unsubHistory();
    };
  }, []);

  const toggleExpand = (id) => setExpanded((e) => ({ ...e, [id]: !e[id] }));

  const addGroup = () => {
    const name = newGroupName.trim();
    if (!name) return;
    const next = { groups: [...catalog.groups, { id: makeId(), name, flavors: [] }] };
    persistCatalog(next);
    setNewGroupName("");
    setShowAddGroup(false);
  };

  const removeGroup = (groupId) => {
    const next = { groups: catalog.groups.filter((g) => g.id !== groupId) };
    persistCatalog(next);
  };

  const addFlavorToCatalog = (groupId, flavorName) => {
    const name = flavorName.trim();
    if (!name) return;
    const next = {
      groups: catalog.groups.map((g) =>
        g.id === groupId && !g.flavors.includes(name)
          ? { ...g, flavors: [...g.flavors, name] }
          : g
      ),
    };
    persistCatalog(next);
  };

  const removeFlavorFromCatalog = (groupId, flavorName) => {
    const next = {
      groups: catalog.groups.map((g) =>
        g.id === groupId
          ? { ...g, flavors: g.flavors.filter((f) => f !== flavorName) }
          : g
      ),
    };
    persistCatalog(next);
  };

  // ---- New arrival flow ----

  const startNewArrival = () => {
    setSelected({});
    setWeights({});
    setFlavorInputs({});
    setResultData(null);
    setView("select");
  };

  const toggleFlavorSelected = (groupId, flavor) => {
    setSelected((prev) => {
      const set = new Set(prev[groupId] || []);
      if (set.has(flavor)) set.delete(flavor);
      else set.add(flavor);
      return { ...prev, [groupId]: set };
    });
  };

  const addFlavorDuringSelect = (groupId) => {
    const val = (flavorInputs[groupId] || "").trim();
    if (!val) return;
    addFlavorToCatalog(groupId, val);
    setSelected((prev) => {
      const set = new Set(prev[groupId] || []);
      set.add(val);
      return { ...prev, [groupId]: set };
    });
    setFlavorInputs((f) => ({ ...f, [groupId]: "" }));
  };

  const selectedCount = Object.values(selected).reduce((n, s) => n + (s ? s.size : 0), 0);

  const goToWeights = () => {
    const w = {};
    catalog.groups.forEach((g) => {
      const set = selected[g.id];
      if (set && set.size) {
        w[g.id] = {};
        g.flavors.filter((f) => set.has(f)).forEach((f) => {
          w[g.id][f] = "";
        });
      }
    });
    setWeights(w);
    setView("weights");
  };

  const setWeightValue = (groupId, flavor, val) => {
    if (val !== "" && !/^\d*[.,]?\d*$/.test(val)) return;
    setWeights((prev) => ({
      ...prev,
      [groupId]: { ...prev[groupId], [flavor]: val },
    }));
  };

  const allWeightsFilled = Object.values(weights).every((flMap) =>
    Object.values(flMap).every((v) => parseFloat(String(v).replace(",", ".")) > 0)
  ) && Object.keys(weights).length > 0;

  const finishArrival = () => {
    const groupsWithWeights = catalog.groups
      .filter((g) => weights[g.id])
      .map((g) => ({
        name: g.name,
        items: Object.entries(weights[g.id]).map(([flavor, weight]) => ({
          flavor,
          weight: String(weight).replace(",", "."),
        })),
      }));
    const { text, total } = buildArrivalText(groupsWithWeights);
    setResultData({ text, total });
    const entry = {
      id: makeId(),
      date: new Date().toISOString(),
      text,
      total,
    };
    persistHistory([entry, ...history]);
    setView("result");
  };

  const copyResult = async () => {
    if (!resultData) return;
    try {
      await navigator.clipboard.writeText(resultData.text);
      setCopyLabel("Скопировано ✓");
      setTimeout(() => setCopyLabel("Скопировать"), 1800);
    } catch {
      setCopyLabel("Не удалось скопировать");
      setTimeout(() => setCopyLabel("Скопировать"), 1800);
    }
  };

  const copyHistoryText = async (text) => {
    try {
      await navigator.clipboard.writeText(text);
    } catch {}
  };

  return (
    <div className="app">
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap');

        :root {
          --bg: #1c1a17;
          --surface: #26221d;
          --surface-2: #322c24;
          --border: #40392f;
          --accent: #c68b3c;
          --accent-soft: rgba(198,139,60,0.16);
          --text: #f2e9dc;
          --text-dim: #a89a87;
          --green: #7a9b6e;
          --green-soft: rgba(122,155,110,0.16);
          --red: #b4573f;
        }
        * { box-sizing: border-box; }
        .app {
          background: var(--bg);
          color: var(--text);
          font-family: 'Inter', sans-serif;
          min-height: 100vh;
          max-width: 480px;
          margin: 0 auto;
          padding-bottom: 90px;
          position: relative;
        }
        .headline {
          font-family: 'Oswald', sans-serif;
          font-weight: 600;
          letter-spacing: 0.01em;
        }
        .topbar {
          padding: 22px 18px 14px;
          border-bottom: 1px solid var(--border);
        }
        .topbar h1 {
          margin: 0;
          font-size: 22px;
        }
        .topbar p {
          margin: 4px 0 0;
          color: var(--text-dim);
          font-size: 13px;
        }
        .content { padding: 16px 14px 20px; }
        .tabbar {
          position: fixed;
          bottom: 0; left: 0; right: 0;
          max-width: 480px;
          margin: 0 auto;
          display: flex;
          background: var(--surface);
          border-top: 1px solid var(--border);
        }
        .tab {
          flex: 1;
          padding: 12px 4px 10px;
          text-align: center;
          background: none;
          border: none;
          color: var(--text-dim);
          font-family: 'Inter', sans-serif;
          font-size: 12px;
          cursor: pointer;
        }
        .tab.active { color: var(--accent); }
        .tab .icon { font-size: 18px; display: block; margin-bottom: 2px; }

        .group-card {
          background: var(--surface);
          border: 1px solid var(--border);
          border-radius: 10px;
          margin-bottom: 10px;
          overflow: hidden;
        }
        .group-header {
          display: flex;
          align-items: center;
          justify-content: space-between;
          padding: 14px 14px;
          cursor: pointer;
        }
        .group-header .name {
          font-family: 'Oswald', sans-serif;
          font-weight: 600;
          font-size: 16px;
        }
        .group-header .meta {
          color: var(--text-dim);
          font-size: 12px;
          margin-top: 2px;
        }
        .chevron {
          color: var(--text-dim);
          transition: transform 0.15s ease;
          font-size: 13px;
        }
        .chevron.open { transform: rotate(90deg); }

          padding: 0 14px 14px;

        }
        .flavor-row {

        }

          padding: 10px 0;
        }

          display: flex;
          gap: 8px;
          margin-top: 10px;
        }
        .add-row input {
          flex: 1;
          background: var(--surface-2);
          border: 1px solid var(--border);
          border-radius: 8px;
          padding: 9px 10px;

        }
        .add-row input:focus { outline: 1px solid var(--accent); }
        .btn {
          background: var(--accent);
          color: #1c1a17;
          border: none;
          border-radius: 8px;
          padding: 9px 14px;
          font-size: 14px;
          font-weight: 600;
          font-family: 'Inter', sans-serif;
          cursor: pointer;
        }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .btn-outline {
          background: none;
          border: 1px solid var(--accent);
          color: var(--accent);
        }
        .btn-ghost {
          background: none;
          border: 1px dashed var(--border);
          color: var(--text-dim);
          width: 100%;
          padding: 12px;
          border-radius: 10px;
          font-size: 14px;
          cursor: pointer;
          margin-bottom: 12px;
        }
        .big-cta {
          position: fixed;
          bottom: 66px; left: 0; right: 0;
          max-width: 480px;
          margin: 0 auto;
          padding: 10px 14px;
          background: linear-gradient(to top, var(--bg) 65%, transparent);
        }
        .big-cta .btn { width: 100%; padding: 14px; font-size: 15px; }

        .checkbox-row {
          display: flex;
          align-items: center;
          gap: 10px;
          padding: 9px 0;

          cursor: pointer;
        }
        .checkbox-row:last-child { border-bottom: none; }

        }
        .checkbox.checked {
          background: var(--green);
          border-color: var(--green);

          font-weight: 700;
        }

        .weight-row {
          display: flex;
          align-items: center;

          padding: 10px 0;
          border-bottom: 1px solid var(--border);
          gap: 10px;
        }
        .weight-row:last-child { border-bottom: none; }
        .weight-row .flavor-name { font-size: 14px; flex: 1; }
        .weight-input-wrap {
          display: flex;
          align-items: center;
          gap: 6px;
        }
        .weight-input-wrap input {
          width: 76px;
          background: var(--surface-2);
          border: 1px solid var(--border);
          border-radius: 8px;
          padding: 8px 8px;
          color: var(--text);
          font-family: 'JetBrains Mono', monospace;
          font-size: 14px;
          text-align: right;
        }
        .weight-input-wrap input:focus { outline: 1px solid var(--accent); }
        .unit { color: var(--text-dim); font-size: 13px; }

        .result-box {
          background: var(--surface);
          border: 1px solid var(--border);
          border-radius: 10px;
          padding: 16px;
          font-family: 'JetBrains Mono', monospace;
          font-size: 13.5px;
          line-height: 1.6;
          white-space: pre-wrap;
          margin-bottom: 14px;
        }
        .result-actions { display: flex; gap: 10px; margin-bottom: 8px; }
        .result-actions .btn { flex: 1; }

        .history-item {
          background: var(--surface);
          border: 1px solid var(--border);
          border-radius: 10px;
          margin-bottom: 10px;
          overflow: hidden;
        }
        .history-head {
          padding: 13px 14px;
          display: flex;
          justify-content: space-between;
          align-items: center;
          cursor: pointer;
        }
        .history-head .date {
          font-size: 14px;
          font-weight: 500;
        }
        .history-head .total {
          font-family: 'JetBrains Mono', monospace;
          color: var(--accent);
          font-size: 13px;
        }
        .history-body {
          padding: 0 14px 14px;
          border-top: 1px solid var(--border);
        }
        .empty-state {
          text-align: center;
          color: var(--text-dim);
          padding: 60px 20px;
          font-size: 14px;
        }
        .step-label {
          color: var(--text-dim);
          font-size: 12px;
          text-transform: uppercase;
          letter-spacing: 0.06em;
          margin-bottom: 10px;
        }
        .link-back {
          background: none;
          border: none;
          color: var(--text-dim);
          font-size: 13px;
          cursor: pointer;
          padding: 0 0 12px;
        }
      `}</style>

      <div className="topbar">
        <h1 className="headline">Фасовка табака</h1>
        <p>
          {view === "catalog" && "Каталог брендов и вкусов"}
          {view === "select" && "Новый приход — выбор вкусов"}
          {view === "weights" && "Новый приход — вес по вкусам"}
          {view === "result" && "Приход создан"}
          {view === "history" && "История приходов"}
        </p>
      </div>

      <div className="content">
        {status === "loading" && <div className="empty-state">Загрузка…</div>}
        {status === "error" && (
          <div className="empty-state">
            Не удалось загрузить данные. Проверьте firebaseConfig в начале файла
            и подключение к интернету, затем обновите страницу.
          </div>
        )}

        {status === "ready" && catalog && view === "catalog" && (
          <CatalogView
            catalog={catalog}
            expanded={expanded}
            toggleExpand={toggleExpand}
            showAddGroup={showAddGroup}
            setShowAddGroup={setShowAddGroup}
            newGroupName={newGroupName}
            setNewGroupName={setNewGroupName}
            addGroup={addGroup}
            removeGroup={removeGroup}
            flavorInputs={flavorInputs}
            setFlavorInputs={setFlavorInputs}
            addFlavorToCatalog={addFlavorToCatalog}
            removeFlavorFromCatalog={removeFlavorFromCatalog}
          />
        )}

        {status === "ready" && catalog && view === "select" && (
          <SelectView
            catalog={catalog}
            selected={selected}
            toggleFlavorSelected={toggleFlavorSelected}
            flavorInputs={flavorInputs}
            setFlavorInputs={setFlavorInputs}
            addFlavorDuringSelect={addFlavorDuringSelect}
            onBack={() => setView("catalog")}
          />
        )}

        {status === "ready" && catalog && view === "weights" && (
          <WeightsView
            catalog={catalog}
            weights={weights}
            setWeightValue={setWeightValue}
            onBack={() => setView("select")}
          />
        )}

        {status === "ready" && view === "result" && resultData && (
          <div>
            <div className="result-box">{resultData.text}</div>
            <div className="result-actions">
              <button className="btn" onClick={copyResult}>{copyLabel}</button>
            </div>
            <button className="btn btn-outline" style={{ width: "100%" }} onClick={startNewArrival}>
              Новый приход
            </button>
            <button className="link-back" style={{ marginTop: 10 }} onClick={() => setView("catalog")}>
              ← В каталог
            </button>
          </div>
        )}

        {status === "ready" && view === "history" && (
          <HistoryView
            history={history}
            openId={openHistoryId}
            setOpenId={setOpenHistoryId}
            onCopy={copyHistoryText}
          />
        )}
      </div>

      {status === "ready" && view === "select" && (
        <div className="big-cta">
          <button className="btn" disabled={selectedCount === 0} onClick={goToWeights}>
            Далее ({selectedCount})
          </button>
        </div>
      )}
      {status === "ready" && view === "weights" && (
        <div className="big-cta">
          <button className="btn" disabled={!allWeightsFilled} onClick={finishArrival}>
            Создать приход
          </button>
        </div>
      )}

      {status === "ready" && (view === "catalog" || view === "history") && (
        <nav className="tabbar">
          <button className={`tab ${view === "catalog" ? "active" : ""}`} onClick={() => setView("catalog")}>
            <span className="icon">📦</span>Каталог
          </button>
          <button className="tab" onClick={startNewArrival}>
            <span className="icon">＋</span>Новый приход
          </button>
          <button className={`tab ${view === "history" ? "active" : ""}`} onClick={() => setView("history")}>
            <span className="icon">🗂</span>История
          </button>
        </nav>
      )}
    </div>
  );
}

function CatalogView({
  catalog, expanded, toggleExpand,
  showAddGroup, setShowAddGroup, newGroupName, setNewGroupName, addGroup, removeGroup,
  flavorInputs, setFlavorInputs, addFlavorToCatalog, removeFlavorFromCatalog,
}) {
  return (
    <div>
      {catalog.groups.map((g) => (
        <div className="group-card" key={g.id}>
          <div className="group-header" onClick={() => toggleExpand(g.id)}>
            <div>
              <div className="name">{g.name}</div>
              <div className="meta">{g.flavors.length ? `${g.flavors.length} вкус(ов)` : "вкусов пока нет"}</div>
            </div>
            <span className={`chevron ${expanded[g.id] ? "open" : ""}`}>▶</span>
          </div>
          {expanded[g.id] && (
            <div className="group-body">
              {g.flavors.length === 0 && <div className="empty-note">Добавьте первый вкус ниже</div>}
              {g.flavors.map((f) => (
                <div className="flavor-row" key={f}>
                  <span>{f}</span>
                  <button className="del-btn" onClick={() => removeFlavorFromCatalog(g.id, f)}>✕</button>
                </div>
              ))}
              <div className="add-row">
                <input
                  placeholder="Новый вкус"
                  value={flavorInputs[g.id] || ""}
                  onChange={(e) => setFlavorInputs((s) => ({ ...s, [g.id]: e.target.value }))}
                  onKeyDown={(e) => {
                    if (e.key === "Enter") {
                      addFlavorToCatalog(g.id, flavorInputs[g.id] || "");
                      setFlavorInputs((s) => ({ ...s, [g.id]: "" }));
                    }
                  }}
                />
                <button
                  className="btn"
                  onClick={() => {
                    addFlavorToCatalog(g.id, flavorInputs[g.id] || "");
                    setFlavorInputs((s) => ({ ...s, [g.id]: "" }));
                  }}
                >
                  Добавить
                </button>
              </div>
              <div style={{ marginTop: 12, textAlign: "right" }}>
                <button className="del-btn" style={{ fontSize: 12 }} onClick={() => removeGroup(g.id)}>
                  Удалить группу
                </button>
              </div>
            </div>
          )}
        </div>
      ))}

      {!showAddGroup && (
        <button className="btn-ghost" onClick={() => setShowAddGroup(true)}>
          ＋ Добавить группу
        </button>
      )}
      {showAddGroup && (
        <div className="add-row" style={{ marginBottom: 16 }}>
          <input
            autoFocus
            placeholder="Название группы"
            value={newGroupName}
            onChange={(e) => setNewGroupName(e.target.value)}
            onKeyDown={(e) => e.key === "Enter" && addGroup()}
          />
          <button className="btn" onClick={addGroup}>Добавить</button>
        </div>
      )}
    </div>
  );
}

function SelectView({ catalog, selected, toggleFlavorSelected, flavorInputs, setFlavorInputs, addFlavorDuringSelect, onBack }) {
  return (
    <div>
      <button className="link-back" onClick={onBack}>← Отмена</button>
      <div className="step-label">Шаг 1 из 2 — отметьте вкусы, которые фасуем</div>
      {catalog.groups.map((g) => {
        const set = selected[g.id] || new Set();
        return (
          <div className="group-card" key={g.id}>
            <div className="group-header" style={{ cursor: "default" }}>
              <div className="name">{g.name}</div>
            </div>
            <div className="group-body" style={{ paddingTop: 4 }}>
              {g.flavors.length === 0 && <div className="empty-note">Нет вкусов — добавьте ниже</div>}
              {g.flavors.map((f) => (
                <div className="checkbox-row" key={f} onClick={() => toggleFlavorSelected(g.id, f)}>
                  <span className={`checkbox ${set.has(f) ? "checked" : ""}`}>{set.has(f) ? "✓" : ""}</span>
                  <span>{f}</span>
                </div>
              ))}
              <div className="add-row">
                <input
                  placeholder="Новый вкус"
                  value={flavorInputs[g.id] || ""}
                  onChange={(e) => setFlavorInputs((s) => ({ ...s, [g.id]: e.target.value }))}
                  onKeyDown={(e) => e.key === "Enter" && addFlavorDuringSelect(g.id)}
                />
                <button className="btn" onClick={() => addFlavorDuringSelect(g.id)}>Добавить</button>
              </div>
            </div>
          </div>
        );
      })}
    </div>
  );
}

function WeightsView({ catalog, weights, setWeightValue, onBack }) {
  const groups = catalog.groups.filter((g) => weights[g.id]);
  return (
    <div>
      <button className="link-back" onClick={onBack}>← Назад к выбору</button>
      <div className="step-label">Шаг 2 из 2 — укажите вес каждого вкуса, г</div>
      {groups.map((g) => (
        <div className="group-card" key={g.id}>
          <div className="group-header" style={{ cursor: "default" }}>
            <div className="name">{g.name}</div>
          </div>
          <div className="group-body" style={{ paddingTop: 4 }}>
            {Object.keys(weights[g.id]).map((f) => (
              <div className="weight-row" key={f}>
                <span className="flavor-name">{f}</span>
                <div className="weight-input-wrap">
                  <input
                    inputMode="decimal"
                    placeholder="0"
                    value={weights[g.id][f]}
                    onChange={(e) => setWeightValue(g.id, f, e.target.value)}
                  />
                  <span className="unit">г</span>
                </div>
              </div>
            ))}
          </div>
        </div>
      ))}
    </div>
  );
}

function HistoryView({ history, openId, setOpenId, onCopy }) {
  if (!history.length) {
    return <div className="empty-state">Пока нет ни одного прихода.<br />Создайте первый на вкладке «Новый приход».</div>;
  }
  return (
    <div>
      {history.map((h) => {
        const totalStr = Number.isInteger(h.total) ? h.total : String(h.total).replace(".", ",");
        const open = openId === h.id;
        return (
          <div className="history-item" key={h.id}>
            <div className="history-head" onClick={() => setOpenId(open ? null : h.id)}>
              <span className="date">{formatDate(h.date)}</span>
              <span className="total">{totalStr} г</span>
            </div>
            {open && (
              <div className="history-body">
                <div className="result-box" style={{ marginTop: 12 }}>{h.text}</div>
                <button className="btn btn-outline" style={{ width: "100%" }} onClick={() => onCopy(h.text)}>
                  Скопировать
                </button>
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<TobaccoPackingApp />);
</script>
</body>
</html>
