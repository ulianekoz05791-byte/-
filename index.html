<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#1c1a17" />
  <title>Фасовка табака</title>
  
  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@18",
      "react-dom/client": "https://esm.sh/react-dom@18/client",
      "firebase/app": "https://esm.sh/firebase@10.13.0/app",
      "firebase/firestore": "https://esm.sh/firebase@10.13.0/firestore",
      "firebase/auth": "https://esm.sh/firebase@10.13.0/auth"
    }
  }
  </script>
  
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap');
    :root {
      --bg: #1c1a17; --surface: #26221d; --surface-2: #322c24; --border: #40392f;
      --accent: #c68b3c; --text: #f2e9dc; --text-dim: #a89a87; --green: #7a9b6e; --red: #b4573f;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; }
    .app { min-height: 100vh; max-width: 480px; margin: 0 auto; padding-bottom: 90px; position: relative; }
    .headline { font-family: 'Oswald', sans-serif; font-weight: 600; letter-spacing: 0.01em; margin: 0; font-size: 22px; }
    .topbar { padding: 22px 18px 14px; border-bottom: 1px solid var(--border); }
    .topbar p { margin: 4px 0 0; color: var(--text-dim); font-size: 13px; }
    .content { padding: 16px 14px 20px; }
    .tabbar { position: fixed; bottom: 0; left: 0; right: 0; max-width: 480px; margin: 0 auto; display: flex; background: var(--surface); border-top: 1px solid var(--border); padding-bottom: env(safe-area-inset-bottom); }
    .tab { flex: 1; padding: 12px 4px 10px; text-align: center; background: none; border: none; color: var(--text-dim); font-family: 'Inter', sans-serif; font-size: 12px; cursor: pointer; }
    .tab.active { color: var(--accent); }
    .tab .icon { font-size: 18px; display: block; margin-bottom: 2px; }
    .group-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 10px; overflow: hidden; }
    .group-header { display: flex; align-items: center; justify-content: space-between; padding: 14px; cursor: pointer; }
    .group-header .name { font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 16px; }
    .group-header .meta { color: var(--text-dim); font-size: 12px; margin-top: 2px; }
    .chevron { color: var(--text-dim); transition: transform 0.15s ease; font-size: 13px; }
    .chevron.open { transform: rotate(90deg); }
    .group-body { padding: 0 14px 14px; border-top: 1px solid var(--border); }
    .flavor-row, .checkbox-row, .weight-row { display: flex; align-items: center; justify-content: space-between; padding: 9px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
    .flavor-row:last-child, .checkbox-row:last-child, .weight-row:last-child { border-bottom: none; }
    .del-btn { background: none; border: none; color: var(--text-dim); font-size: 16px; cursor: pointer; padding: 4px 8px; }
    .del-btn:active { color: var(--red); }
    .empty-note { color: var(--text-dim); font-size: 13px; padding: 10px 0; }
    .add-row { display: flex; gap: 8px; margin-top: 10px; }
    .add-row input { flex: 1; background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 10px; color: var(--text); font-size: 14px; font-family: 'Inter', sans-serif; }
    .add-row input:focus { outline: 1px solid var(--accent); }
    .btn { background: var(--accent); color: #1c1a17; border: none; border-radius: 8px; padding: 10px 14px; font-size: 14px; font-weight: 600; font-family: 'Inter', sans-serif; cursor: pointer; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-outline { background: none; border: 1px solid var(--accent); color: var(--accent); }
    .btn-ghost { background: none; border: 1px dashed var(--border); color: var(--text-dim); width: 100%; padding: 12px; border-radius: 10px; font-size: 14px; cursor: pointer; margin-bottom: 12px; }
    .big-cta { position: fixed; bottom: 66px; left: 0; right: 0; max-width: 480px; margin: 0 auto; padding: 10px 14px; background: linear-gradient(to top, var(--bg) 65%, transparent); }
    .big-cta .btn { width: 100%; padding: 14px; font-size: 15px; }
    .checkbox { width: 22px; height: 22px; border-radius: 5px; border: 1.5px solid var(--border); flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
    .checkbox.checked { background: var(--green); border-color: var(--green); color: #1c1a17; font-size: 14px; font-weight: 700; }
    .weight-row { gap: 10px; }
    .weight-row .flavor-name { flex: 1; }
    .weight-input-wrap { display: flex; align-items: center; gap: 6px; }
    .weight-input-wrap input { width: 80px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 10px; color: var(--text); font-family: 'JetBrains Mono', monospace; font-size: 14px; text-align: right; }
    .weight-input-wrap input:focus { outline: 1px solid var(--accent); }
    .unit { color: var(--text-dim); font-size: 13px; }
    .result-box { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px; font-family: 'JetBrains Mono', monospace; font-size: 13.5px; line-height: 1.6; white-space: pre-wrap; margin-bottom: 14px; }
    .result-actions { display: flex; gap: 10px; margin-bottom: 8px; }
    .result-actions .btn { flex: 1; }
    .history-item { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 10px; overflow: hidden; }
    .history-head { padding: 13px 14px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
    .history-head .date { font-size: 14px; font-weight: 500; }
    .history-head .total { font-family: 'JetBrains Mono', monospace; color: var(--accent); font-size: 13px; }
    .history-body { padding: 0 14px 14px; border-top: 1px solid var(--border); }
    .empty-state { text-align: center; color: var(--text-dim); padding: 60px 20px; font-size: 14px; }
    .step-label { color: var(--text-dim); font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 10px; }
    .link-back { background: none; border: none; color: var(--text-dim); font-size: 13px; cursor: pointer; padding: 0 0 12px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    import React, { useState, useEffect, useCallback, useRef } from 'react';
    import { createRoot } from 'react-dom/client';
    import { initializeApp } from 'firebase/app';
    import { getFirestore, doc, setDoc, onSnapshot } from 'firebase/firestore';
    import { getAuth, signInAnonymously } from 'firebase/auth';

    const firebaseConfig = {
      apiKey: "AIzaSyD_E8vljdDaVjF4CFKsCCph7Q3069z8EDM",
      authDomain: "unpacking-ce1d5.firebaseapp.com",
      projectId: "unpacking-ce1d5",
      storageBucket: "unpacking-ce1d5.firebasestorage.app",
      messagingSenderId: "610484816194",
      appId: "1:610484816194:web:cccfc61f91dca6809f60db"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    const DEFAULT_GROUPS = ["blackBurn", "sebero", "masthave", "darkside", "догма", "satyr", "bonche", "trofimofff's", "tangiers", "deus", "сарма", "jent", "spectrum", "overdose", "starline", "afzal"];

    function makeId() { return Math.random().toString(36).slice(2) + Date.now().toString(36); }
    function defaultCatalog() { return { groups: DEFAULT_GROUPS.map((name) => ({ id: makeId(), name, flavors: [] })) }; }
    function formatDate(iso) {
      const d = new Date(iso);
      return d.toLocaleDateString("ru-RU", { day: "2-digit", month: "2-digit", year: "numeric" }) + " " + d.toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" });
    }
    function buildArrivalText(groupsWithWeights) {
      const lines = []; let total = 0;
      groupsWithWeights.forEach((g) => {
        lines.push(g.name);
        g.items.forEach((it) => {
          const w = parseFloat(it.weight) || 0; total += w;
          const wStr = Number.isInteger(w) ? String(w) : String(w).replace(".", ",");
          lines.push(`${it.flavor} - ${wStr} г`);
        });
        lines.push(" ");
      });
      const totalStr = Number.isInteger(total) ? String(total) : String(total).replace(".", ",");
      lines.push(`Всего: ${totalStr} г`);
      return { text: lines.join("\n"), total };
    }

    function TobaccoPackingApp() {
      const [status, setStatus] = useState("loading");
      const [catalog, setCatalog] = useState(null);
      const [history, setHistory] = useState([]);
      const [view, setView] = useState("catalog");
      const [expanded, setExpanded] = useState({});
      const [showAddGroup, setShowAddGroup] = useState(false);
      const [newGroupName, setNewGroupName] = useState("");
      const [flavorInputs, setFlavorInputs] = useState({});
      const [selected, setSelected] = useState({});
      const [weights, setWeights] = useState({});
      const [resultData, setResultData] = useState(null);
      const [copyLabel, setCopyLabel] = useState("Скопировать");
      const [openHistoryId, setOpenHistoryId] = useState(null);
      const didInit = useRef(false);

      const persistCatalog = useCallback(async (next) => {
        setCatalog(next);
        try { await setDoc(doc(db, "app_data", "catalog"), next); } 
        catch (e) { console.error("Failed to save catalog", e); }
      }, []);

      const persistHistory = useCallback(async (next) => {
        setHistory(next);
        try { await setDoc(doc(db, "app_data", "history"), { items: next }); } 
        catch (e) { console.error("Failed to save history", e); }
      }, []);

      useEffect(() => {
        if (didInit.current) return;
        didInit.current = true;

        const init = async () => {
          try {
            await signInAnonymously(auth);
            
            const unsubCatalog = onSnapshot(doc(db, "app_data", "catalog"), (docSnap) => {
              if (docSnap.exists()) setCatalog(docSnap.data());
              else {
                const def = defaultCatalog();
                setDoc(doc(db, "app_data", "catalog"), def);
                setCatalog(def);
              }
              setStatus("ready");
            });

            const unsubHistory = onSnapshot(doc(db, "app_data", "history"), (docSnap) => {
              if (docSnap.exists()) setHistory(docSnap.data().items || []);
              else {
                setDoc(doc(db, "app_data", "history"), { items: [] });
                setHistory([]);
              }
            });

            return () => { unsubCatalog(); unsubHistory(); };
          } catch (e) {
            console.error("Firebase init error:", e);
            setStatus("error");
          }
        };
        init();
      }, []);

      const toggleExpand = (id) => setExpanded((e) => ({ ...e, [id]: !e[id] }));
      const addGroup = () => {
        const name = newGroupName.trim(); if (!name) return;
        persistCatalog({ groups: [...catalog.groups, { id: makeId(), name, flavors: [] }] });
        setNewGroupName(""); setShowAddGroup(false);
      };
      const removeGroup = (groupId) => {
        persistCatalog({ groups: catalog.groups.filter((g) => g.id !== groupId) });
      };
      const addFlavorToCatalog = (groupId, flavorName) => {
        const name = flavorName.trim(); if (!name) return;
        persistCatalog({
          groups: catalog.groups.map((g) => g.id === groupId && !g.flavors.includes(name) ? { ...g, flavors: [...g.flavors, name] } : g),
        });
      };
      const removeFlavorFromCatalog = (groupId, flavorName) => {
        persistCatalog({
          groups: catalog.groups.map((g) => g.id === groupId ? { ...g, flavors: g.flavors.filter((f) => f !== flavorName) } : g),
        });
      };

      const startNewArrival = () => { setSelected({}); setWeights({}); setFlavorInputs({}); setResultData(null); setView("select"); };
      const toggleFlavorSelected = (groupId, flavor) => {
        setSelected((prev) => {
          const set = new Set(prev[groupId] || []);
          if (set.has(flavor)) set.delete(flavor); else set.add(flavor);
          return { ...prev, [groupId]: set };
        });
      };
      const addFlavorDuringSelect = (groupId) => {
        const val = (flavorInputs[groupId] || "").trim(); if (!val) return;
        addFlavorToCatalog(groupId, val);
        setSelected((prev) => { const set = new Set(prev[groupId] || []); set.add(val); return { ...prev, [groupId]: set }; });
        setFlavorInputs((f) => ({ ...f, [groupId]: "" }));
      };
      const selectedCount = Object.values(selected).reduce((n, s) => n + (s ? s.size : 0), 0);
      
      const goToWeights = () => {
        const w = {};
        catalog.groups.forEach((g) => {
          const set = selected[g.id];
          if (set && set.size) {
            w[g.id] = {};
            g.flavors.filter((f) => set.has(f)).forEach((f) => { w[g.id][f] = ""; });
          }
        });
        setWeights(w); setView("weights");
      };
      const setWeightValue = (groupId, flavor, val) => {
        if (val !== "" && !/^\d*[.,]?\d*$/.test(val)) return;
        setWeights((prev) => ({ ...prev, [groupId]: { ...prev[groupId], [flavor]: val } }));
      };
      const allWeightsFilled = Object.values(weights).every((flMap) => Object.values(flMap).every((v) => parseFloat(String(v).replace(",", ".")) > 0)) && Object.keys(weights).length > 0;
      
      const finishArrival = () => {
        const groupsWithWeights = catalog.groups.filter((g) => weights[g.id]).map((g) => ({
          name: g.name, items: Object.entries(weights[g.id]).map(([flavor, weight]) => ({ flavor, weight: String(weight).replace(",", ".") })),
        }));
        const { text, total } = buildArrivalText(groupsWithWeights);
        setResultData({ text, total });
        persistHistory([{ id: makeId(), date: new Date().toISOString(), text, total }, ...history]);
        setView("result");
      };
      const copyResult = async () => {
        if (!resultData) return;
        try { await navigator.clipboard.writeText(resultData.text); setCopyLabel("Скопировано ✓"); setTimeout(() => setCopyLabel("Скопировать"), 1800); } 
        catch { setCopyLabel("Не удалось"); setTimeout(() => setCopyLabel("Скопировать"), 1800); }
      };
      const copyHistoryText = async (text) => { try { await navigator.clipboard.writeText(text); } catch {} };

      if (status === "loading") return <div className="app"><div className="empty-state">Подключение к базе...</div></div>;
      if (status === "error") return <div className="app"><div className="empty-state">Ошибка подключения. Проверьте интернет или правила Firebase.</div></div>;

      return (
        <div className="app">
          <div className="topbar">
            <h1 className="headline">Фасовка табака</h1>
            <p>{view === "catalog" && "Каталог"}{view === "select" && "Выбор вкусов"}{view === "weights" && "Указание веса"}{view === "result" && "Приход создан"}{view === "history" && "История"}</p>
          </div>
          <div className="content">
            {view === "catalog" && catalog && (
              <div>
                {catalog.groups.map((g) => (
                  <div className="group-card" key={g.id}>
                    <div className="group-header" onClick={() => toggleExpand(g.id)}>
                      <div><div className="name">{g.name}</div><div className="meta">{g.flavors.length ? `${g.flavors.length} вкус(ов)` : "вкусов пока нет"}</div></div>
                      <span className={`chevron ${expanded[g.id] ? "open" : ""}`}>▶</span>
                    </div>
                    {expanded[g.id] && (
                      <div className="group-body">
                        {g.flavors.length === 0 && <div className="empty-note">Добавьте первый вкус ниже</div>}
                        {g.flavors.map((f) => (<div className="flavor-row" key={f}><span>{f}</span><button className="del-btn" onClick={() => removeFlavorFromCatalog(g.id, f)}>✕</button></div>))}
                        <div className="add-row">
                          <input placeholder="Новый вкус" value={flavorInputs[g.id] || ""} onChange={(e) => setFlavorInputs((s) => ({ ...s, [g.id]: e.target.value }))} onKeyDown={(e) => { if (e.key === "Enter") { addFlavorToCatalog(g.id, flavorInputs[g.id]); setFlavorInputs((s) => ({ ...s, [g.id]: "" })); } }} />
                          <button className="btn" onClick={() => { addFlavorToCatalog(g.id, flavorInputs[g.id]); setFlavorInputs((s) => ({ ...s, [g.id]: "" })); }}>Добавить</button>
                        </div>
                        <div style={{ marginTop: 12, textAlign: "right" }}><button className="del-btn" style={{ fontSize: 12 }} onClick={() => removeGroup(g.id)}>Удалить группу</button></div>
                      </div>
                    )}
                  </div>
                ))}
                {!showAddGroup && <button className="btn-ghost" onClick={() => setShowAddGroup(true)}>＋ Добавить группу</button>}
                {showAddGroup && (
                  <div className="add-row" style={{ marginBottom: 16 }}>
                    <input autoFocus placeholder="Название группы" value={newGroupName} onChange={(e) => setNewGroupName(e.target.value)} onKeyDown={(e) => e.key === "Enter" && addGroup()} />
                    <button className="btn" onClick={addGroup}>Добавить</button>
                  </div>
                )}
              </div>
            )}
            {view === "select" && catalog && (
              <div>
                <button className="link-back" onClick={() => setView("catalog")}>← Отмена</button>
                <div className="step-label">Шаг 1 из 2 — отметьте вкусы</div>
                {catalog.groups.map((g) => {
                  const set = selected[g.id] || new Set();
                  return (
                    <div className="group-card" key={g.id}>
                      <div className="group-header" style={{ cursor: "default" }}><div className="name">{g.name}</div></div>
                      <div className="group-body" style={{ paddingTop: 4 }}>
                        {g.flavors.length === 0 && <div className="empty-note">Нет вкусов</div>}
                        {g.flavors.map((f) => (<div className="checkbox-row" key={f} onClick={() => toggleFlavorSelected(g.id, f)}><span className={`checkbox ${set.has(f) ? "checked" : ""}`}>{set.has(f) ? "✓" : ""}</span><span>{f}</span></div>))}
                        <div className="add-row">
                          <input placeholder="Новый вкус" value={flavorInputs[g.id] || ""} onChange={(e) => setFlavorInputs((s) => ({ ...s, [g.id]: e.target.value }))} onKeyDown={(e) => e.key === "Enter" && addFlavorDuringSelect(g.id)} />
                          <button className="btn" onClick={() => addFlavorDuringSelect(g.id)}>Добавить</button>
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
            {view === "weights" && catalog && (
              <div>
                <button className="link-back" onClick={() => setView("select")}>← Назад к выбору</button>
                <div className="step-label">Шаг 2 из 2 — укажите вес, г</div>
                {catalog.groups.filter((g) => weights[g.id]).map((g) => (
                  <div className="group-card" key={g.id}>
                    <div className="group-header" style={{ cursor: "default" }}><div className="name">{g.name}</div></div>
                    <div className="group-body" style={{ paddingTop: 4 }}>
                      {Object.keys(weights[g.id]).map((f) => (
                        <div className="weight-row" key={f}>
                          <span className="flavor-name">{f}</span>
                          <div className="weight-input-wrap">
                            <input inputMode="decimal" placeholder="0" value={weights[g.id][f]} onChange={(e) => setWeightValue(g.id, f, e.target.value)} />
                            <span className="unit">г</span>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                ))}
              </div>
            )}
            {view === "result" && resultData && (
              <div>
                <div className="result-box">{resultData.text}</div>
                <div className="result-actions"><button className="btn" onClick={copyResult}>{copyLabel}</button></div>
                <button className="btn btn-outline" style={{ width: "100%" }} onClick={startNewArrival}>Новый приход</button>
                <button className="link-back" style={{ marginTop: 10 }} onClick={() => setView("catalog")}>← В каталог</button>
              </div>
            )}
            {view === "history" && (
              <div>
                {!history.length ? <div className="empty-state">Пока нет ни одного прихода.</div> : history.map((h) => {
                  const totalStr = Number.isInteger(h.total) ? h.total : String(h.total).replace(".", ",");
                  const open = openHistoryId === h.id;
                  return (
                    <div className="history-item" key={h.id}>
                      <div className="history-head" onClick={() => setOpenHistoryId(open ? null : h.id)}>
                        <span className="date">{formatDate(h.date)}</span><span className="total">{totalStr} г</span>
                      </div>
                      {open && (<div className="history-body"><div className="result-box" style={{ marginTop: 12 }}>{h.text}</div><button className="btn btn-outline" style={{ width: "100%" }} onClick={() => copyHistoryText(h.text)}>Скопировать</button></div>)}
                    </div>
                  );
                })}
              </div>
            )}
          </div>
          {view === "select" && (<div className="big-cta"><button className="btn" disabled={selectedCount === 0} onClick={goToWeights}>Далее ({selectedCount})</button></div>)}
          {view === "weights" && (<div className="big-cta"><button className="btn" disabled={!allWeightsFilled} onClick={finishArrival}>Создать приход</button></div>)}
          {(view === "catalog" || view === "history") && (
            <nav className="tabbar">
              <button className={`tab ${view === "catalog" ? "active" : ""}`} onClick={() => setView("catalog")}><span className="icon">📦</span>Каталог</button>
              <button className="tab" onClick={startNewArrival}><span className="icon">＋</span>Новый приход</button>
              <button className={`tab ${view === "history" ? "active" : ""}`} onClick={() => setView("history")}><span className="icon">🗂</span>История</button>
            </nav>
          )}
        </div>
      );
    }

    const root = createRoot(document.getElementById("root"));
    root.render(<TobaccoPackingApp />);
  </script>
</body>
</html>
